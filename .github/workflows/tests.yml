# Проверки на каждый пуш.
#
# Гоняем только те, которым не нужен экран: оконные поднимают настоящее
# окно Tk, а на машине сборки монитора нет. Полный прогон —
# «python tests/run_all.py» на своей машине.

name: проверки

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  quick:
    name: без окна
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Поставить зависимости сервера
        run: |
          python -m pip install --upgrade pip
          pip install "websockets>=14,<16" Pillow pywebpush

      - name: Прогон
        run: python tests/run_all.py --quick
