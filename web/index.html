<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17212b">
<title>Velix</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Экран входа -->
<section id="auth" class="screen">
  <div class="card">
    <div class="logo">V</div>
    <h1>Velix</h1>
    <p id="auth-subtitle" class="muted" data-t="Вход в аккаунт">Вход в аккаунт</p>

    <input id="login" type="text" data-t-placeholder="Логин" placeholder="Логин"
           autocomplete="username" autocapitalize="none" autocorrect="off">
    <input id="password" type="password" data-t-placeholder="Пароль" placeholder="Пароль"
           autocomplete="current-password">
    <input id="name" type="text" data-t-placeholder="Как вас зовут"
           placeholder="Как вас зовут" hidden>
    <input id="invite" type="text" data-t-placeholder="Код приглашения"
           placeholder="Код приглашения" hidden
           autocapitalize="characters" autocorrect="off">

    <button id="primary" class="primary" data-t="Войти">Войти</button>
    <button id="switch-mode" class="link" data-t="Создать аккаунт">Создать аккаунт</button>
    <p id="auth-error" class="error"></p>
  </div>
</section>

<!-- Список переписок и участников -->
<section id="list" class="screen" hidden>
  <header class="bar">
    <strong class="grow">Velix</strong>
    <button id="profile-button" class="icon-button" data-t-title="Профиль"
            title="Профиль">⋯</button>
  </header>

  <input id="search" class="search" type="text" data-t-placeholder="Поиск по переписке"
         placeholder="Поиск по переписке">

  <main class="scroll">
    <div id="conversations"></div>
    <p id="people-title" class="muted small section" data-t="УЧАСТНИКИ" hidden>УЧАСТНИКИ</p>
    <div id="people"></div>
  </main>
</section>

<!-- Переписка -->
<section id="chat" class="screen" hidden>
  <header class="bar">
    <button id="back-to-list" class="icon-button" data-t-title="Назад" title="Назад">‹</button>
    <div class="avatar" id="chat-avatar">V</div>
    <div class="bar-titles">
      <strong id="chat-title">Общий чат</strong>
      <span id="status" class="muted small"></span>
    </div>
  </header>

  <main id="messages"></main>

  <div id="reply-bar" class="reply-bar" hidden>
    <span id="reply-text" class="muted small grow"></span>
    <button id="cancel-reply" class="icon-button small-button">✕</button>
  </div>

  <form id="composer" autocomplete="off">
    <label class="icon-button" for="file">+</label>
    <input id="file" type="file" accept="image/*,video/*" hidden>
    <input id="text" type="text" data-t-placeholder="Написать сообщение…"
           placeholder="Написать сообщение…" autocomplete="off">
    <button id="send" class="send" type="submit">➤</button>
  </form>
</section>

<!-- Профиль -->
<section id="profile" class="screen" hidden>
  <div class="card">
    <h1 data-t="Профиль">Профиль</h1>
    <div class="avatar big" id="my-avatar">?</div>
    <label class="link" for="avatar-file" data-t="Сменить фото">Сменить фото</label>
    <input id="avatar-file" type="file" accept="image/*" hidden>

    <input id="profile-name" type="text" data-t-placeholder="Как вас зовут"
           placeholder="Как вас зовут">
    <textarea id="profile-bio" rows="3" data-t-placeholder="Пара слов о себе"
              placeholder="Пара слов о себе"></textarea>
    <p id="profile-hint" class="muted small"></p>

    <div class="setting">
      <span class="muted small" data-t="Язык">Язык</span>
      <select id="language">
        <option value="en">English</option>
        <option value="ru">Русский</option>
      </select>
    </div>

    <button id="save-profile" class="primary" data-t="Сохранить">Сохранить</button>
    <button id="back-to-chat" class="link" data-t="Назад">Назад</button>
    <button id="logout" class="link danger" data-t="Выйти из аккаунта">Выйти из аккаунта</button>
  </div>
</section>

<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
